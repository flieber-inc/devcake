# DevCake CI — Bake control-plane images (GHA BuildKit cache) + pytest +
# minimal compose hello-dispatch smoke. Compose never builds; see docker-bake.hcl.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVCAKE_TAG: latest

jobs:
  bake-and-test:
    name: Bake (ci) + pytest + dispatch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Assert image digests pinned (ISSUES #29)
        run: python3 scripts/check_image_pins.py

      - name: Test hermetic admin helpers
        run: npm run test:helpers --prefix admin/spa

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --prefix admin/spa

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Bake app, app-test, admin, hello
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          files: |
            ./docker-bake.hcl
            ./docker-bake.ci.hcl
          targets: ci
          load: true
          provenance: false
          sbom: false
          set: |
            *.cache-from=type=gha,scope=devcake-ci
            *.cache-to=type=gha,mode=max,scope=devcake-ci,ignore-error=true

      - name: Assert prod app has no pytest
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint python "devcake/app:${DEVCAKE_TAG}" -c 'import pytest' 2>/dev/null; then
            echo "FAIL: prod app image must not include pytest" >&2
            exit 1
          fi
          docker run --rm --entrypoint sh "devcake/app:${DEVCAKE_TAG}" -c \
            'test ! -d /srv/tests && echo "prod: no tests/ OK"'

      - name: Start Redis (live messaging tests)
        run: |
          set -euo pipefail
          docker network create devcake_control 2>/dev/null || true
          docker rm -f devcake-ci-redis 2>/dev/null || true
          docker run -d --name devcake-ci-redis --network devcake_control \
            --network-alias redis \
            redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 \
            redis-server --requirepass ci-redis-pass --appendonly no
          for i in $(seq 1 30); do
            if docker exec devcake-ci-redis redis-cli --no-auth-warning -a ci-redis-pass ping | grep -q PONG; then
              echo "redis ready"
              exit 0
            fi
            sleep 1
          done
          echo "redis failed to become ready" >&2
          docker logs devcake-ci-redis || true
          exit 1

      - name: Ruff (syntax / undefined names)
        run: |
          set -euo pipefail
          docker run --rm -e RUFF_CACHE_DIR=/tmp/ruff-cache -w /srv \
            "devcake/app-test:${DEVCAKE_TAG}" \
            ruff check devcake tests

      - name: Audit Python environment
        run: |
          docker run --rm -w /srv "devcake/app-test:${DEVCAKE_TAG}" \
            pip-audit --local --progress-spinner=off

      - name: Pytest via app-test on compose network
        run: |
          set -euo pipefail
          docker run --rm \
            --network devcake_control \
            -e REDIS_URL=redis://redis:6379/0 \
            -e REDIS_PASSWORD=ci-redis-pass \
            -v "${{ github.workspace }}/images/common:/srv/images/common:ro" \
            -v "${{ github.workspace }}/images/hello:/srv/images/hello:ro" \
            -v "${{ github.workspace }}/docker-bake.hcl:/srv/docker-bake.hcl:ro" \
            -v "${{ github.workspace }}/.github/workflows/docker-publish.yml:/srv/docker-publish.yml:ro" \
            -v "${{ github.workspace }}/dagu/dags:/srv/dagu-dags:ro" \
            -v "${{ github.workspace }}/app/Dockerfile:/srv/app.Dockerfile:ro" \
            -v "${{ github.workspace }}/docs:/srv/docs:ro" \
            -v "${{ github.workspace }}/scripts:/srv/repo-scripts:ro" \
            -w /srv \
            "devcake/app-test:${DEVCAKE_TAG}" \
            python -m pytest tests/ -q --tb=short -o cache_dir=/tmp/pytest-cache

      # Free the control network before compose claims it. Unit-test Redis creates
      # a bare `devcake_control` network (no compose labels); compose refuses to
      # adopt it unless we remove both the container and the network.
      - name: Cleanup unit-test Redis
        if: always()
        run: |
          docker rm -f devcake-ci-redis 2>/dev/null || true
          docker network rm devcake_control 2>/dev/null || true

      # Minimal compose (no Gitea) + hard readiness — scripts/ci_compose_for_dispatch.sh
      # then real Dagu → hello → Redis → finalize (scripts/ci_dispatch_hello.sh).
      - name: Compose stack for dispatch smoke
        run: |
          set -euo pipefail
          docker rm -f devcake-ci-redis 2>/dev/null || true
          docker network rm devcake_control 2>/dev/null || true
          export DEVCAKE_TAG="${DEVCAKE_TAG}"
          export DOCKER_GID
          DOCKER_GID="$(stat -c %g /var/run/docker.sock)"
          # 2026-08 evaluation: the contract batteries ride this same stack,
          # so it now includes the bundled Gitea (zero external tokens)
          export CI_COMPOSE_WITH_GITEA=1
          chmod +x scripts/ci_compose_for_dispatch.sh scripts/ci_dispatch_hello.sh
          ./scripts/ci_compose_for_dispatch.sh

      - name: Hello dispatch pipeline smoke
        run: |
          set -euo pipefail
          export ADMIN_USER=admin
          export ADMIN_PASSWORD=Ci-admin-Pass1!
          export DEVCAKE_BASE_URL=http://127.0.0.1:8080
          # Cold CI: allow more polls (30 × 3s default may be tight under load)
          export DEVCAKE_HELLO_POLLS=40
          ./scripts/ci_dispatch_hello.sh

      - name: Forge + PMO contract batteries (bundled Gitea lane)
        run: |
          set -euo pipefail
          # The strongest integration artifacts in the repo, previously run
          # only from a hand-raised local stack (2026-08 evaluation): real
          # repos, PRs, merges, labels — inside the app container, against
          # the bundled Gitea, zero external tokens. Exit code is the verdict.
          docker compose exec -T app python - < scripts/contract_tests_forge.py
          docker compose exec -T app python - < scripts/contract_tests_pmo.py

      - name: Teardown compose stack
        if: always()
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          docker rm -f devcake-ci-redis 2>/dev/null || true
          docker network rm devcake_control 2>/dev/null || true
