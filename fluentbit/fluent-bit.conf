# Ships dagu/redis container stdout to OpenObserve stream `container_logs`.
# Receives the docker `fluentd` logging driver (forward protocol) — docs/13 §7.

[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[OUTPUT]
    Name             http
    Match            *
    Host             openobserve
    Port             5080
    URI              /api/default/container_logs/_json
    Format           json
    Json_date_key    _timestamp
    Json_date_format iso8601
    HTTP_User        ${OO_INGEST_EMAIL}
    HTTP_Passwd      ${OO_INGEST_PASSWORD}
    Retry_Limit      5
