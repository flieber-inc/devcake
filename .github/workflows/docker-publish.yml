# Optional publish of DevCake images to GHCR (manual).
# Images: ghcr.io/<owner>/devcake/<name>:<sha12> and :latest
name: Docker publish

on:
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Bake + push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name prefix
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=${{ env.REGISTRY }}/${owner}/devcake" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bake and push all images
        uses: docker/bake-action@v7
        env:
          DEVCAKE_TAG: ${{ steps.meta.outputs.sha }}
        with:
          files: |
            ./docker-bake.hcl
            ./docker-bake.ci.hcl
          targets: all
          push: true
          provenance: false
          sbom: false
          set: |
            *.cache-from=type=gha,scope=devcake-publish
            *.cache-to=type=gha,mode=max,scope=devcake-publish
            app.tags=${{ steps.meta.outputs.prefix }}/app:${{ steps.meta.outputs.sha }}
            app.tags=${{ steps.meta.outputs.prefix }}/app:latest
            admin.tags=${{ steps.meta.outputs.prefix }}/admin:${{ steps.meta.outputs.sha }}
            admin.tags=${{ steps.meta.outputs.prefix }}/admin:latest
            hello.tags=${{ steps.meta.outputs.prefix }}/dev-hello:${{ steps.meta.outputs.sha }}
            hello.tags=${{ steps.meta.outputs.prefix }}/dev-hello:latest
            claude-code.tags=${{ steps.meta.outputs.prefix }}/dev-claude-code:${{ steps.meta.outputs.sha }}
            claude-code.tags=${{ steps.meta.outputs.prefix }}/dev-claude-code:latest
            codex.tags=${{ steps.meta.outputs.prefix }}/dev-codex:${{ steps.meta.outputs.sha }}
            codex.tags=${{ steps.meta.outputs.prefix }}/dev-codex:latest
            grok-build.tags=${{ steps.meta.outputs.prefix }}/dev-grok-build:${{ steps.meta.outputs.sha }}
            grok-build.tags=${{ steps.meta.outputs.prefix }}/dev-grok-build:latest
