# DevCake admin panel — docs/11-admin-panel.md.
# One basic-auth gate covers the SPA AND the /api proxy (the API is the real
# sensitive surface). `app` exposes no host port; this is the only way in.

server {
    listen 80;
    server_name _;

    auth_basic           "DevCake admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Unauthenticated: compose healthcheck only.
    location = /nginx-health {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
