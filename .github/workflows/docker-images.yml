# Bake Dev harness images (shared base stage) with GHA BuildKit cache.
# Heavy job — runs when harness paths change (PR and main) or on dispatch.
name: Docker images

on:
  pull_request:
    paths:
      - "images/**"
      - "docker-bake.hcl"
      - "docker-bake.ci.hcl"
      - ".github/workflows/docker-images.yml"
  push:
    branches: [main]
    paths:
      - "images/**"
      - "docker-bake.hcl"
      - "docker-bake.ci.hcl"
      - ".github/workflows/docker-images.yml"
  # Allow manual full rebuild (e.g. after CLI pin bumps).
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVCAKE_TAG: latest

jobs:
  bake-harnesses:
    name: Bake Dev harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Bake hello + claude-code + codex + grok-build + pi + opencode + qwen-code
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          files: |
            ./docker-bake.hcl
            ./docker-bake.ci.hcl
          targets: images
          load: true
          provenance: false
          sbom: false
          set: |
            *.cache-from=type=gha,scope=devcake-images
            *.cache-to=type=gha,mode=max,scope=devcake-images,ignore-error=true

      - name: Smoke harness CLIs (pinned versions)
        # `sh -ec 'a && b'`: without -e (and with `;` separators) only the
        # LAST command's exit code propagated — a broken CLI or a USER
        # regression to root sailed through green (audit A2). Every harness
        # check asserts the CLI reports the Dockerfile ARG pin.
        run: |
          set -euo pipefail
          CLAUDE_PIN=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' images/Dockerfile)
          CODEX_PIN=$(sed -n 's/^ARG CODEX_VERSION=//p' images/Dockerfile)
          GROK_PIN=$(sed -n 's/^ARG GROK_VERSION=//p' images/Dockerfile)
          PI_PIN=$(sed -n 's/^ARG PI_VERSION=//p' images/Dockerfile)
          OPENCODE_PIN=$(sed -n 's/^ARG OPENCODE_VERSION=//p' images/Dockerfile)
          QWEN_PIN=$(sed -n 's/^ARG QWEN_CODE_VERSION=//p' images/Dockerfile)
          test -n "$CLAUDE_PIN" && test -n "$CODEX_PIN" && test -n "$GROK_PIN" && test -n "$PI_PIN" && test -n "$OPENCODE_PIN" && test -n "$QWEN_PIN"
          docker run --rm --entrypoint sh "devcake/dev-claude-code:${DEVCAKE_TAG}" -ec \
            "id | grep -q uid=1000 && claude --version | grep -F \"$CLAUDE_PIN\" && test -f /dev_entrypoint.py"
          docker run --rm --entrypoint sh "devcake/dev-codex:${DEVCAKE_TAG}" -ec \
            "id | grep -q uid=1000 && codex --version | grep -F \"$CODEX_PIN\" && test -f /dev_entrypoint.py"
          docker run --rm --entrypoint sh "devcake/dev-grok-build:${DEVCAKE_TAG}" -ec \
            "id | grep -q uid=1000 && grok --version | grep -F \"$GROK_PIN\" && test -f /dev_entrypoint.py"
          docker run --rm --entrypoint sh "devcake/dev-pi:${DEVCAKE_TAG}" -ec \
            "id | grep -q uid=1000 && pi --version | grep -F \"$PI_PIN\" && test -f /dev_entrypoint.py"
          docker run --rm --entrypoint sh "devcake/dev-opencode:${DEVCAKE_TAG}" -ec \
            "id | grep -q uid=1000 && opencode --version | grep -F \"$OPENCODE_PIN\" && test -f /dev_entrypoint.py"
          docker run --rm --entrypoint sh "devcake/dev-qwen-code:${DEVCAKE_TAG}" -ec \
            "id | grep -q uid=1000 && qwen --version | grep -F \"$QWEN_PIN\" && test -f /dev_entrypoint.py"
          # Layer presence only — full Dagu→hello→finalize smoke is ci.yml.
          docker run --rm --entrypoint python "devcake/dev-hello:${DEVCAKE_TAG}" -c \
            'import redis; print("hello redis import ok")'
          echo "harness smoke OK"

      - name: Drift probe (bake verb)
        # Part of the bake verb (PLAN_CLI_PINS 0b): compile is not enough —
        # a row-level receipt must be written for each launch-supported
        # house pin. Claude 401 is matrix-not-required (no stub-driven capture).
        run: |
          set -euo pipefail
          CLAUDE_PIN=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' images/Dockerfile)
          CODEX_PIN=$(sed -n 's/^ARG CODEX_VERSION=//p' images/Dockerfile)
          GROK_PIN=$(sed -n 's/^ARG GROK_VERSION=//p' images/Dockerfile)
          mkdir -p /tmp/harness_receipts
          bash scripts/harness_probe/host_probe.sh grok-build "$GROK_PIN" \
            "devcake/dev-grok-build:${DEVCAKE_TAG}" /tmp/harness_receipts
          bash scripts/harness_probe/host_probe.sh claude-code "$CLAUDE_PIN" \
            "devcake/dev-claude-code:${DEVCAKE_TAG}" /tmp/harness_receipts
          bash scripts/harness_probe/host_probe.sh codex "$CODEX_PIN" \
            "devcake/dev-codex:${DEVCAKE_TAG}" /tmp/harness_receipts
          python3 -c "
          import json, pathlib, sys
          ok = True
          for name in (
              f'grok-build@${GROK_PIN}.json',
              f'claude-code@${CLAUDE_PIN}.json',
              f'codex@${CODEX_PIN}.json',
          ):
              rec = json.loads(pathlib.Path('/tmp/harness_receipts', name).read_text())
              print(name, 'ok=' + str(rec.get('ok')))
              ok = ok and rec.get('ok')
          sys.exit(0 if ok else 1)
          "
