# DevCake otel-collector (docs/12 §1): Dev containers on
# devcake_runtime export OTLP here UNAUTHENTICATED; this collector alone holds
# the OpenObserve service-account credentials and forwards traces upstream.
# Devs therefore carry no OO credentials at all — the collector is the
# security boundary (docs/14 §2a). The app does NOT route through this
# (it exports directly to OO; a sick collector must never blind the app).

extensions:
  health_check:                      # GET :13133/ → 200 when the pipeline is up
    endpoint: 0.0.0.0:13133
  basicauth/oo:
    client_auth:
      username: ${env:OO_INGEST_EMAIL}
      password: ${env:OO_INGEST_PASSWORD}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

# The receiver is unauthenticated (docs/14 §2 honest limit), so bound the
# blast radius of a flooding Dev: memory_limiter sheds load instead of
# OOM-killing the collector; batch smooths the upstream write rate.
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}

exporters:
  otlphttp/openobserve:
    # the exporter appends /v1/traces itself — do NOT include it here
    endpoint: http://openobserve:5080/api/${env:OO_ORG}
    auth:
      authenticator: basicauth/oo

service:
  extensions: [health_check, basicauth/oo]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
