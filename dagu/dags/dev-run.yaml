        resources:                       # nested ON PURPOSE — header note
          Memory: ${params.MEMORY_BYTES}
          NanoCPUs: ${params.NANO_CPUS}
          PidsLimit: ${params.PIDS}
          # /dev/fuse for fuse-overlayfs on kernels <5.13; ≥5.13 uses native
          # rootless overlay and never opens it (matrix 2026-08-13)
          Devices:
            - PathOnHost: /dev/fuse
              PathInContainer: /dev/fuse
              CgroupPermissions: rwm
            - PathOnHost: /dev/net/tun
              PathInContainer: /dev/net/tun
              CgroupPermissions: rwm

  - id: run_dev
    depends: [provision]
    action: docker.run
    with:
      image: ${params.IMAGE}
      container_name: dev-${params.RUN_ID}
      pull: never
      auto_remove: true
      # ONLY the per-run workspace — no mirrors line; that is the point.
      volumes:
        - $DEVCAKE_WS_HOST/${params.RUN_ID}:/workspace
      container:
        Env:
          - DEVCAKE_PHASE=harness
          - DEVCAKE_RUN_ID=${params.RUN_ID}
          - TRACEPARENT=${params.TRACEPARENT}
          - REDIS_URL=redis://redis:6379/0
          - REDIS_USER=${params.REDIS_USER}
          - REDIS_PASSWORD=${params.REDIS_PASSWORD}
      host:
        NetworkMode: devcake_runtime
        SecurityOpt:
          - *nested_seccomp
        resources:                       # nested ON PURPOSE — header note
          Memory: ${params.MEMORY_BYTES}
          NanoCPUs: ${params.NANO_CPUS}
          PidsLimit: ${params.PIDS}
          Devices:
            - PathOnHost: /dev/fuse
              PathInContainer: /dev/fuse
              CgroupPermissions: rwm
            - PathOnHost: /dev/net/tun
              PathInContainer: /dev/net/tun
              CgroupPermissions: rwm
