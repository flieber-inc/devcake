[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devcake-cli"
version = "0.1.0"
description = "DevCake host CLI (up/down/status/doctor/setup/baker run)"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.12"
keywords = ["devcake", "agents", "orchestration", "self-hosted"]
# Host baker still imports scripts/dev_factory under PYTHONPATH=scripts:app
# (supervisor / devcake up already export that pair). No runtime deps here —
# keep the console script thin (ADR-0038 Decision 3).
dependencies = []

[project.urls]
Homepage = "https://github.com/flieber-inc/devcake"
Documentation = "https://github.com/flieber-inc/devcake/tree/main/docs"

[project.scripts]
devcake = "devcake_cli.main:main"

[tool.setuptools.package-dir]
"" = "cli"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["devcake_cli*"]
