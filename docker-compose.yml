# DevCake runtime stack.
#
# Images are built ONLY via Bake (docker-bake.hcl) — compose never builds:
#   ./up.sh --bake                  # discover DOCKER_GID + bake CP+hello + baker
#   ./up.sh                         # day-to-day restart (re-discovers DOCKER_GID)
#   docker buildx bake all          # first install / full upgrade (manual)
#   docker buildx bake              # app + admin only
#   docker buildx bake images       # Dev harnesses + hello
#   docker compose up -d            # needs DOCKER_GID already in .env / env
#
# Image tags must match bake output (default TAG/DEVCAKE_TAG=latest).
name: devcake

# Control-plane ports bind to loopback by default (ISSUES #17). Remote access
# requires SSH tunnels or host firewall rules — Dagu holds docker.sock and is
# root-equivalent if reachable. restart: unless-stopped on long-lived services
# (ISSUES #21) so host reboots recover the stack automatically.

# Bounded local logs for services NOT on the fluentd pipeline (2026-08-12
# audit L1): the pipeline itself (fluentbit/otel-collector) cannot ship to
# fluentd, and admin/openobserve carried the DEFAULT json-file driver with NO
# max-size — unbounded disk growth until a host daemon.json cap, which most
# hosts lack. 10 MB × 3 files is a generous local ring for a loopback service.
x-local-logs: &local_logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *local_logs
    image: devcake/app:${DEVCAKE_TAG:-latest}
    pull_policy: never                  # local bake only — never pull from a registry
    env_file: .env
    environment:
      # dispatch derives harness image tags from this (audit A7) — it must
      # match the bake tag, or a pinned install runs stale :latest harnesses
      DEVCAKE_TAG: ${DEVCAKE_TAG:-latest}
      # internal-forge admin credential: .env carries only the PASSWORD, so
      # without this the provisioner authenticated as an EMPTY user and every
      # boot's org/service-account/skill-store provisioning 401'd
      # (live-verified 2026-07-17) — same default as the gitea service below
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-devcakeadmin}
    restart: unless-stopped
    volumes:
      - devcake_data:/data              # note: NO docker.sock — kill/reconcile go via the Dagu API
      # ADR-0024: bare source mirrors, app-writable; the dev-run PROVISION
      # step mounts the SAME volume read-only (real name devcake_mirrors) —
      # agent containers never see it (ADR-0025)
      - mirrors:/mirrors
      # ADR-0025: per-run workspace tree. Host bind (NOT a named volume —
      # the DAG needs per-run subpaths); up.sh upserts the HOST-ABSOLUTE
      # path into .env, `:?` fails loud if it is missing
      - ${DEVCAKE_WS_HOST:?run ./up.sh — it derives the workspace base}:/workspaces
      # test fixture only: tests/test_entrypoint_render.py exercises the Dev
      # entrypoint's renderers by path; the app never imports this at runtime
      - ./images/common:/srv/images/common:ro
    depends_on:
      redis:       { condition: service_healthy }
      openobserve: { condition: service_started }
      dagu:        { condition: service_healthy }
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dagu:
    image: ghcr.io/dagucloud/dagu:2.13.0@sha256:8f69fcff4e671433cb42b2f8fd5ae948aeeb0b842ecca29cae13537aed52f15d  # docs/13 §4 (ADR-0024 §7 rider)
    restart: unless-stopped
    ports: [ "127.0.0.1:8525:8080" ]       # loopback only — docs/14
    environment:                          # basic auth: API requires creds; health stays open
      - DAGU_AUTH_MODE=basic
      - DAGU_AUTH_BASIC_USERNAME=${DAGU_USER}
      - DAGU_AUTH_BASIC_PASSWORD=${DAGU_PASSWORD:?set a strong DAGU_PASSWORD in .env}
      # entrypoint runs dagu as uid 1000 with group $DOCKER_GID → docker.sock access
      # (least privilege; find yours with: stat -c %g /var/run/docker.sock)
      - DOCKER_GID=${DOCKER_GID:?set DOCKER_GID in .env}
      # ADR-0025: dev-run.yaml expands $DEVCAKE_WS_HOST in its per-run
      # workspace bind sources — resolved on the DAEMON host, so the value
      # must be host-absolute (up.sh derives it; `:?` fails loud, because an
      # EMPTY expansion would silently bind-mount junk at the host root)
      - DEVCAKE_WS_HOST=${DEVCAKE_WS_HOST:?run ./up.sh — it derives the workspace base}
      # 2.13 compat (measured at the 2026-08-13 drill): the 2.12 wiki/
      # documents store defaults to <dags_dir>/wiki and crash-loops the
      # server against our deliberately-RO dags bind (docs/14 §5 — trusted
      # launch code stays RO). No disable knob exists; point it at the
      # writable state volume instead. The feature stays unused (all
      # business logic in the app; the DAG is a dumb launcher, docs/13 §4).
      - DAGU_WIKI_DIR=/var/lib/dagu/wiki
    # Stock /entrypoint.sh only runs /etc/custom-init.d/* when the file is +x.
    # The bind is :ro, so a non-executable host file is a silent skip → alpine
    # `addgroup` fails on this ubuntu image → `sudo: unknown group #$DOCKER_GID`
    # crash-loop. Always invoke hooks via `sh` (bit-independent), then hand off.
    entrypoint:
      - /usr/local/bin/tini
      - -g
      - --
      - /bin/sh
      - -ec
      - |
        if [ -d /etc/custom-init.d ]; then
          for f in /etc/custom-init.d/*; do
            [ -f "$$f" ] || continue
            echo "Running $$f"
            sh "$$f"
          done
        fi
        exec /entrypoint.sh "$$@"
      - dagu-init
    command: ["dagu", "start-all"]
    volumes:
      - dagu_data:/var/lib/dagu
      - ./dagu/dags:/var/lib/dagu/dags:ro  # trusted launch code — RO (docs/14 §5)
      - ./dagu/init:/etc/custom-init.d:ro # repairs the image's DOCKER_GID mechanism
      - /var/run/docker.sock:/var/run/docker.sock  # ⚠ root-equivalent host access — docs/14 §5
    depends_on:
      fluentbit: { condition: service_started }
    networks: [control]
    logging: &ship_stdout                 # stdout → fluent-bit → OpenObserve (docs/13 §7)
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"             # never block container start on the shipper
        tag: "{{.Name}}"
    healthcheck:
      # stock image ships no curl/wget — bash /dev/tcp HTTP probe (verified)
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    # 2026-08 evaluation hardening:
    # - maxmemory 1gb + noeviction: the flood backstop. The app XACK+XDELs
    #   ingress entries after every handled batch, so legit load stays far
    #   below the cap; a Dev flooding XADD faster than the app drains gets
    #   write ERRORS instead of OOMing the whole control plane. noeviction
    #   on purpose — evicting stream entries would silently lose run
    #   artifacts; erroring the writer is the honest failure.
    # - aclfile + ACL SAVE (from the app on every SETUSER/DELUSER): per-run
    #   Dev users survive a redis-only restart, so in-flight runs reconnect
    #   and finish instead of stranding until the heartbeat grace kills
    #   them. MEASURED 2026-08-04: with --aclfile configured redis IGNORES
    #   --requirepass entirely — an empty aclfile left the default user
    #   password-LESS (the CI smoke caught it: the app's authed connection
    #   failed with "AUTH called without any password configured"). The
    #   default user therefore lives IN the aclfile, regenerated from .env
    #   on every boot (grep drops the old default line, dev-* lines are
    #   preserved) — which also makes REDIS_PASSWORD rotation just work.
    #   The file must exist at boot (redis refuses a missing aclfile).
    #   Plaintext password rides /data/users.acl inside the volume — same
    #   exposure class as the AOF, docs/14 volume-theft row.
    entrypoint: ["sh", "-c",
                 "touch /data/users.acl && grep -v \"^user default \" /data/users.acl > /tmp/acl.new; cat /tmp/acl.new > /data/users.acl; echo \"user default on >$${REDIS_PASSWORD} ~* &* +@all\" >> /data/users.acl && exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction --aclfile /data/users.acl"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}   # runtime shell expansion — the exec-array quoting safety the old command form had
    volumes: [ redis_data:/data ]
    depends_on:
      fluentbit: { condition: service_started }
    networks: [control, runtime]
    logging: *ship_stdout
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  openobserve:
    <<: *local_logs
    image: public.ecr.aws/zinclabs/openobserve:v0.91.5@sha256:012c9701b4b7a2f7070f9264a85eb7ed6d4998e4763628341924f06cdc810e6f
    restart: unless-stopped
    environment:
      - ZO_ROOT_USER_EMAIL=${OO_ROOT_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${OO_ROOT_PASSWORD}
    volumes: [ oo_data:/data ]
    ports: [ "127.0.0.1:5080:5080" ]
    # control-only (audit A23): post-M8 nothing on devcake_runtime needs OO —
    # Devs export to the collector, which bridges both networks below. OO on
    # runtime let a compromised Dev reach the full authenticated OO API.
    networks: [control]

  admin:
    <<: *local_logs
    image: devcake/admin:${DEVCAKE_TAG:-latest}
    pull_policy: never                  # local bake only
    restart: unless-stopped
    ports: [ "127.0.0.1:8080:80" ]      # loopback only — docs/14
    environment:
      - DAGU_UI_URL=${DAGU_UI_URL:-http://localhost:8525}
      - OO_UI_URL=${OO_UI_URL:-http://localhost:5080}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on: [ app ]
    networks: [control]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev harness images (devcake/dev-*) are built by Bake, never run as compose
  # services — Dagu spawns them. See docker-bake.hcl group "images".

  fluentbit:
    <<: *local_logs
    image: fluent/fluent-bit:3.2@sha256:d6dec000c4929a439562525728c708f6e99800d7ddc82efd6aa4f45f3a20b562
    restart: unless-stopped
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    environment:
      # OO service account — root creds never leave the openobserve service
      - OO_INGEST_EMAIL=${OO_INGEST_EMAIL}
      - OO_INGEST_PASSWORD=${OO_INGEST_PASSWORD}
    volumes:
      - ./fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports: [ "127.0.0.1:24224:24224" ]     # receives the fluentd logging driver (host side)
    networks: [control]

  # Dev-side telemetry boundary (docs/12 §1, ISSUES #13): Devs on
  # devcake_runtime export OTLP here with NO credentials; only this collector
  # holds the OO service account. Image is FROM scratch — no shell, so no
  # container healthcheck (the otlphttp exporter retries; ordering is soft).
  otel-collector:
    <<: *local_logs
    image: otel/opentelemetry-collector-contrib:0.135.0@sha256:89107a3a8f4636a396927edf7025bb9614b8da2d92f4cc3f43109e8d115736e2
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - OO_INGEST_EMAIL=${OO_INGEST_EMAIL}
      - OO_INGEST_PASSWORD=${OO_INGEST_PASSWORD}
      - OO_ORG=${OO_ORG:-default}
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [ openobserve ]
    # bridges the two networks (audit A23): Devs reach it on runtime, it
    # reaches OO over control — OO itself left the runtime network
    networks: [control, runtime]

  # Internal fallback forge (docs/16 M11): zero-repo missions get an
  # auto-created repository here. Straddles both networks — the app
  # provisions/merges over control; Devs clone/push over runtime. UI on
  # loopback :3300 (the Dagu/OO pattern); admin creds are a stack bootstrap
  # secret (.env, GITEA_ADMIN_*). The wrapper runs config-gen → migrate →
  # idempotent admin create BEFORE the stock entrypoint (live-verified:
  # gitea CLI fatals without the generated app.ini).
  gitea:
    image: gitea/gitea:1.27.1-rootless@sha256:36cce26be71609091e1236d5b5de2c66a81fb8a7d45756a5fd3b7a28c11733b7
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/etc/devcake-init/entrypoint-wrapper.sh"]
    environment:
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__database__DB_TYPE=sqlite3
      # web sessions in the DB, not memory: a container restart must not log
      # the operator out — a private repo 404s for an anonymous visitor,
      # which reads as "my repo got wiped" (founder report 2026-07-15)
      - GITEA__session__PROVIDER=db
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__server__DISABLE_SSH=true
      - GITEA__actions__ENABLED=false
      - GITEA__log__MODE=console
      - GITEA__server__ROOT_URL=${GITEA_UI_URL:-http://localhost:3300}/
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-devcakeadmin}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:?set a strong GITEA_ADMIN_PASSWORD in .env}
    volumes:
      - gitea_data:/var/lib/gitea
      - ./gitea/init:/etc/devcake-init:ro
    ports: [ "127.0.0.1:3300:3000" ]       # loopback only — docs/14
    depends_on:
      fluentbit: { condition: service_started }
    networks: [control, runtime]
    logging: *ship_stdout
    healthcheck:
      # curl ships in the rootless image (live-verified)
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s                    # first boot runs migrate

networks:
  control:
    name: devcake_control
  # Dev containers need outbound forge/package access. The absence of app,
  # admin, and Dagu from this network is the control-plane isolation boundary.
  runtime:
    name: devcake_runtime

volumes:
  gitea_data: {}
  devcake_data: {}
  dagu_data: {}
  redis_data: {}
  oo_data: {}
  # ADR-0024: disposable source-mirror cache (safe to `docker volume rm` —
  # the app re-warms). Real name devcake_mirrors (project prefix); the
  # dev-run DAG mounts it by that literal name, network-precedent style.
  mirrors: {}
