# Rootless store for the Dev container.
#
# graphroot is the per-run workspace bind (host ext4, not this
# container's overlay upper). Overlay-on-overlay cannot do a native
# diff, so Podman would fall back to fuse-overlayfs and charge that
# page cache to the Dev cgroup. mount_program empty overrides the
# fuse-overlayfs line shipped in the podman-static /etc/containers
# copy when the two files are merged.
[storage]
driver = "overlay"
graphroot = "/workspace/.podman-storage"

[storage.options.overlay]
ignore_chown_errors = "true"
mount_program = ""
