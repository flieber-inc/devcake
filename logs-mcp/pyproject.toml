# devcake-logs-mcp — standalone package. The devcake Dev images install it
# with `pip install --no-deps` against their own pinned httpx/mcp
# (images/Dockerfile); the ranges below serve standalone installs.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devcake-logs-mcp"
version = "0.1.0"
description = "Read-only stdio MCP server over log platforms (Datadog, AWS CloudWatch Logs) — compact, token-economical responses for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devcake-logs-mcp = "logs_mcp.server:main"

[tool.setuptools.packages.find]
include = ["logs_mcp*"]
