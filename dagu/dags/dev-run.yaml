# dev-run: one Dev run = two dependent containers (ADR-0025). Only non-secret
# params (+ the per-run scoped Redis ACL credential, docs/09 §1a); everything
# else reaches the Dev via runspec.get — the provision step gets a REDUCED
# spec, the harness step the full one.
#
#   provision  (prov-<run_id>): trusted entrypoint code, no agent — mounts the
#              source mirrors RO + this run's workspace, clones everything,
#              writes the marker, exits.
#   run_dev    (dev-<run_id>):  the agent — mounts ONLY the per-run workspace.
#              /mirrors does not exist in this container (probe-verified).
#
# $DEVCAKE_WS_HOST expands from the dagu SERVICE env (compose) and MUST be a
# host-absolute path: bind sources resolve on the daemon host (docs/13 §4).
# ${params.RUN_ID} interpolates inside volume sources (probe-verified 2.11.3;
# re-verified through the docker.run form on 2.13.0).
#
# Resource limits (closes the old ISSUES #20 deferral): both steps use the
# docker.run action form, whose `host:` block passes Docker SDK HostConfig.
# The cgroup fields live in HostConfig's EMBEDDED Resources struct, and Dagu
# 2.13.0 decodes `host:` without mapstructure Squash — so they only land via
# the NESTED `resources:` key below (measured 2026-08-13: flat `Memory:` at
# host level silently decodes to 0; nested lands; params interpolate and
# weak-type to int64; 0 ⇒ unlimited end-to-end).
#
# ⚠ FUTURE DAGU BUMP (upstream fix: dagucloud/dagu#2557): once Dagu ships
# the Squash fix, the nested `resources:` form STOPS matching (measured
# post-fix: decodes to 0) and the flat form becomes correct — on the first
# bump past that fix, move Memory/NanoCPUs/PidsLimit up one level into
# `host:` and delete this note. docs/13 §4 carries the same reminder.

timeout_sec: 9000               # 150 min belt-and-suspenders; the app watchdog kills at 120
max_clean_up_time_sec: 30       # grace between SIGTERM and SIGKILL on stop
retry_policy:
  limit: 0                      # Dagu must NOT auto-retry: DevCake owns attempt counting
                                # (docs/15 §2; the default would retry failed runs 3x)

# Fence manual Dagu-UI runs (ADR-0025 R11): a bare "Run" click with default
# params would otherwise bind the WHOLE workspace base rw into a container.
preconditions:
  - condition: "${params.RUN_ID}"
    expected: "re:^[A-Za-z0-9_-]{6,64}$"
  # NO ${DEVCAKE_WS_HOST} precondition — attempted 2026-08-04 (AUD-003's
  # missing half) and REVERTED the same hour: Dagu 2.11.3 expands service
  # env in bind strings but NOT in precondition `condition:` fields, so the
  # literal never matched and every dev-run sat `dispatched` until the
  # startup grace killed it (measured live, SYS-HELLO-5). The empty/relative
  # WS_HOST edge stays guarded by up.sh's absolute-path assert + the
  # in-container sentinel (exit 20); the daemon-autocreate residue remains
  # tracked debt (docs/14 §11).

# Workspace ownership reclaim (audit 2026-08-13 B1): nested rootless podman
# writes land on the /workspace bind as host uid 100000+ (the dev user's
# subuid range) — the app (uid 1000) can neither chmod nor unlink them, so
# WorkspaceStore's reclaim would silently leak. This exit handler re-chowns
# the per-run workspace back to uid 1000 as root; DELETION stays in the app
# (workspaces.py — the one reclaim seam). `exit` runs on success, failure,
# AND abort (REST stop kills the step containers, not the agent — measured
# in the 2.13 source); by handler time no nested writer is alive (podman
# processes die with the harness container's pid namespace). Residual: a
# dagu crash mid-run skips the handler — the app logs the unreclaimable
# tree loudly and /health counts it (workspaces.leaked).
handler_on:
  exit:
    # Step-level fence, load-bearing: Dagu runs exit handlers even when the
    # DAG-level preconditions REJECT the run — with an empty RUN_ID the bind
    # source would degrade to the workspaces ROOT and chown every live
    # run's tree. Same regex as the DAG-level fence above.
    preconditions:
      - condition: "${params.RUN_ID}"
        expected: "re:^[A-Za-z0-9_-]{6,64}$"
    action: docker.run
    timeout_sec: 300              # a pathological tree must not hang the DAG
    with:
      image: ${params.IMAGE}      # local bake only — never Hub (audit A7)
      container_name: reclaim-${params.RUN_ID}
      pull: never
      auto_remove: true
      volumes:
        - $DEVCAKE_WS_HOST/${params.RUN_ID}:/workspace
      container:
        User: "0"
        # -h: never chown through symlinks; || true: a reclaim hiccup must
        # never flip a green run. Root in the initial userns owns subuid
        # files; every image this DAG launches ships GNU coreutils (the
        # ADR-0023 floor — hello included).
        Entrypoint: ["/bin/sh", "-c",
                     "chown -R -h 1000:1000 /workspace || true"]
      host:
        NetworkMode: none         # ownership surgery needs no network

params:
  - name: RUN_ID
    default: ""
  - name: IMAGE
    default: ""
  - name: TRACEPARENT
    default: ""
  - name: REDIS_USER
    default: ""
  - name: REDIS_PASSWORD
    default: ""
  # Per-container hard limits (AppConfig.container_limits — the app computes
  # and sends these every dispatch; the "0" defaults apply only to manual UI
  # runs and mean UNLIMITED, engine-verified).
  - name: MEMORY_BYTES
    default: "0"
  - name: NANO_CPUS
    default: "0"
  - name: PIDS
    default: "0"

steps:
  - id: provision
    action: docker.run
    with:
      image: ${params.IMAGE}
      container_name: prov-${params.RUN_ID}
      pull: never
      auto_remove: true
      # ADR-0024: the app-maintained source mirrors, READ-ONLY (kernel-
      # enforced; re-measured on 2.13.0 through this form). Real docker
      # volume name on purpose. ADR-0025: mounted in THIS step only — the
      # agent never sees it.
      volumes:
        - devcake_mirrors:/mirrors:ro
        - $DEVCAKE_WS_HOST/${params.RUN_ID}:/workspace
      container:
        Env:
          - DEVCAKE_PHASE=provision
          - DEVCAKE_RUN_ID=${params.RUN_ID}
          - TRACEPARENT=${params.TRACEPARENT}
          - REDIS_URL=redis://redis:6379/0
          - REDIS_USER=${params.REDIS_USER}
          - REDIS_PASSWORD=${params.REDIS_PASSWORD}
      host:
        NetworkMode: devcake_runtime
        # Nested-engine floor (ADR-0023 addendum): rootless podman needs the
        # userns/mount syscall set — this is Docker's DEFAULT profile plus one
        # 15-syscall allow rule (clone/clone3/unshare/setns/mount/umount2/
        # pivot_root/keyctl/move_mount/open_tree/fsopen/fsconfig/fsmount/
        # sethostname/setdomainname),
        # measured minimal 2026-08-13; NOT unconfined. Inline because the
        # Docker API takes profile CONTENT (only the docker CLI reads files);
        # the structural test json-parses this blob and pins the rule.
        SecurityOpt:
          - &nested_seccomp 'seccomp={"defaultAction":"SCMP_ACT_ERRNO","defaultErrnoRet":1,"archMap":[{"architecture":"SCMP_ARCH_X86_64","subArchitectures":["SCMP_ARCH_X86","SCMP_ARCH_X32"]},{"architecture":"SCMP_ARCH_AARCH64","subArchitectures":["SCMP_ARCH_ARM"]},{"architecture":"SCMP_ARCH_MIPS64","subArchitectures":["SCMP_ARCH_MIPS","SCMP_ARCH_MIPS64N32"]},{"architecture":"SCMP_ARCH_MIPS64N32","subArchitectures":["SCMP_ARCH_MIPS","SCMP_ARCH_MIPS64"]},{"architecture":"SCMP_ARCH_MIPSEL64","subArchitectures":["SCMP_ARCH_MIPSEL","SCMP_ARCH_MIPSEL64N32"]},{"architecture":"SCMP_ARCH_MIPSEL64N32","subArchitectures":["SCMP_ARCH_MIPSEL","SCMP_ARCH_MIPSEL64"]},{"architecture":"SCMP_ARCH_S390X","subArchitectures":["SCMP_ARCH_S390"]},{"architecture":"SCMP_ARCH_RISCV64","subArchitectures":null},{"architecture":"SCMP_ARCH_LOONGARCH64","subArchitectures":null}],"syscalls":[{"names":["accept","accept4","access","adjtimex","alarm","bind","brk","cachestat","capget","capset","chdir","chmod","chown","chown32","clock_adjtime","clock_adjtime64","clock_getres","clock_getres_time64","clock_gettime","clock_gettime64","clock_nanosleep","clock_nanosleep_time64","close","close_range","connect","copy_file_range","creat","dup","dup2","dup3","epoll_create","epoll_create1","epoll_ctl","epoll_ctl_old","epoll_pwait","epoll_pwait2","epoll_wait","epoll_wait_old","eventfd","eventfd2","execve","execveat","exit","exit_group","faccessat","faccessat2","fadvise64","fadvise64_64","fallocate","fanotify_mark","fchdir","fchmod","fchmodat","fchmodat2","fchown","fchown32","fchownat","fcntl","fcntl64","fdatasync","fgetxattr","flistxattr","flock","fork","fremovexattr","fsetxattr","fstat","fstat64","fstatat64","fstatfs","fstatfs64","fsync","ftruncate","ftruncate64","futex","futex_requeue","futex_time64","futex_wait","futex_waitv","futex_wake","futimesat","getcpu","getcwd","getdents","getdents64","getegid","getegid32","geteuid","geteuid32","getgid","getgid32","getgroups","getgroups32","getitimer","getpeername","get