# DevCake admin panel — docs/11-admin-panel.md.
# One basic-auth gate covers the SPA AND the /api proxy (the API is the real
# sensitive surface). `app` exposes no host port; this is the only way in.
#
# Docker embedded DNS (127.0.0.11) + variable proxy_pass: nginx resolves `app`
# at request time, so the process can start when the upstream is not yet up
# (compose boot order, CI smoke without a running app).

server {
    listen 80;
    server_name _;

    # Docker Compose / Swarm DNS
    resolver 127.0.0.11 ipv6=off valid=10s;

    auth_basic           "DevCake admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Unauthenticated: compose healthcheck only.
    location = /nginx-health {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # Variable forces runtime DNS lookup (static "app" fails at startup if missing).
        set $devcake_app app:8000;
        proxy_pass         http://$devcake_app;
        proxy_set_header   Host $host;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
