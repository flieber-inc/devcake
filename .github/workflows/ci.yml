# DevCake CI — Bake control-plane images (GHA BuildKit cache) + pytest.
# Compose never builds; see docker-bake.hcl + docker-bake.ci.hcl.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVCAKE_TAG: latest

jobs:
  bake-and-test:
    name: Bake (ci) + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assert image digests pinned (ISSUES #29)
        run: python3 scripts/check_image_pins.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bake app, app-test, admin, hello
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            ./docker-bake.ci.hcl
          targets: ci
          # Load into the local docker store for pytest / smoke steps.
          load: true
          # Provenance attestations break multi-target load on some runners.
          provenance: false
          sbom: false
          # Force GHA cache only (override local .buildx-cache from docker-bake.hcl).
          set: |
            *.cache-from=type=gha,scope=devcake-ci
            *.cache-to=type=gha,mode=max,scope=devcake-ci

      - name: Assert prod app has no pytest
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint python "devcake/app:${DEVCAKE_TAG}" -c 'import pytest' 2>/dev/null; then
            echo "FAIL: prod app image must not include pytest" >&2
            exit 1
          fi
          docker run --rm --entrypoint sh "devcake/app:${DEVCAKE_TAG}" -c \
            'test ! -d /srv/tests && echo "prod: no tests/ OK"'

      - name: Start Redis (live messaging tests)
        run: |
          set -euo pipefail
          docker network create devcake_control 2>/dev/null || true
          docker rm -f devcake-ci-redis 2>/dev/null || true
          docker run -d --name devcake-ci-redis --network devcake_control \
            --network-alias redis \
            redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 \
            redis-server --requirepass ci-redis-pass --appendonly no
          for i in $(seq 1 30); do
            if docker exec devcake-ci-redis redis-cli --no-auth-warning -a ci-redis-pass ping | grep -q PONG; then
              echo "redis ready"
              exit 0
            fi
            sleep 1
          done
          echo "redis failed to become ready" >&2
          docker logs devcake-ci-redis || true
          exit 1

      - name: Pytest via app-test on compose network
        run: |
          set -euo pipefail
          docker run --rm \
            --network devcake_control \
            -e REDIS_URL=redis://redis:6379/0 \
            -e REDIS_PASSWORD=ci-redis-pass \
            -v "${{ github.workspace }}/images/common:/srv/images/common:ro" \
            -w /srv \
            "devcake/app-test:${DEVCAKE_TAG}" \
            python -m pytest tests/ -q --tb=short

      - name: Admin nginx health smoke
        run: |
          set -euo pipefail
          docker rm -f devcake-ci-admin 2>/dev/null || true
          docker run -d --name devcake-ci-admin -p 18080:80 \
            -e ADMIN_USER=admin \
            -e ADMIN_PASSWORD=Admin-test1! \
            -e DAGU_UI_URL=http://localhost:8525 \
            -e OO_UI_URL=http://localhost:5080 \
            "devcake/admin:${DEVCAKE_TAG}"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/nginx-health | grep -q ok; then
              echo "admin health OK"
              docker rm -f devcake-ci-admin
              exit 0
            fi
            sleep 1
          done
          docker logs devcake-ci-admin || true
          docker rm -f devcake-ci-admin || true
          exit 1

      - name: Hello image entrypoint smoke
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "devcake/dev-hello:${DEVCAKE_TAG}" \
            -c 'import redis; print("hello image ok")'

      - name: Cleanup Redis
        if: always()
        run: docker rm -f devcake-ci-redis 2>/dev/null || true
